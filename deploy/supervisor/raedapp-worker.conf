; =============================================================================
; Supervisor program for the RaedApp queue worker (production VPS).
;
; Processes queued jobs: WhatsApp + email notifications (invoice generated,
; payment confirmed, overdue, attendance, announcements), and any other
; ShouldQueue work. Without a running worker these jobs sit in the `jobs`
; table and never send.
;
; Install: see deploy/README.md
; =============================================================================
[program:raedapp-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/raedapp/artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600 --timeout=60
directory=/var/www/raedapp
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/raedapp/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; give an in-flight job up to --timeout seconds to finish on a graceful stop
stopwaitsecs=70
